<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wildfire Map</title>

    <link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css" />
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <header>
        <h1>Wildfire Map</h1>
    </header>

    <main>
        <div class="map">
            <div id="viewDiv"></div>
            <p id="hint" hidden>Click on the map to place the point.</p>
        </div>

        <aside class="panel">
            <section>
                <h2>Selected (<span id="count">0</span>)</h2>
                <ul id="selection"></ul>

                <div class="row">
                    <button id="saveBtn" type="button">Save Selected</button>
                    <button id="deleteBtn" type="button" class="danger">Delete Selected</button>
                </div>
                <button id="restoreBtn" type="button" class="link">Restore hidden fires</button>

                <p class="note">
                    Delete only hides the features from the map. The ArcGIS FeatureServer
                    is never modified.
                </p>
            </section>

            <section>
                <h2>New point</h2>
                <button id="addBtn" type="button">Add Fire Point</button>

                <form id="addForm" hidden>
                    <input id="addDesc" type="text" maxlength="75" placeholder="Description" />
                    <div class="row">
                        <button type="submit">Add</button>
                        <button id="cancelBtn" type="button" class="link">Cancel</button>
                    </div>
                </form>
            </section>

            <p id="status" class="status">Loading…</p>
        </aside>
    </main>

    <script src="https://js.arcgis.com/4.29/"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
